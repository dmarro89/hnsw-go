name: Blocked arena random gather experiment

on:
  pull_request:
    paths:
      - 'benchmarks/distance_blocked_gather_test.go'
      - '.github/workflows/blocked-arena-gather.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Correctness
        run: go test ./benchmarks -run TestDistanceGather4Agrees -count=1
      - name: Benchmark arbitrary candidate gather
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^$' -bench '^BenchmarkDistanceGather4$' -benchmem -count=7 | tee .artifacts/distance-gather4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: distance-gather4-${{ github.run_id }}
          path: .artifacts/distance-gather4.txt
