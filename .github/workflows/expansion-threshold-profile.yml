name: Expansion threshold profile

on:
  pull_request:
    paths:
      - 'hnsw/expansion_outcome_profile_test.go'
      - '.github/workflows/expansion-threshold-profile.yml'
  workflow_dispatch:

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Profile expansion threshold outcomes
        shell: bash
        run: |
          set -o pipefail
          go test ./hnsw -run TestProfileExpansionThresholdOutcomes -count=1 -v | tee expansion-threshold.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-threshold-${{ github.run_id }}
          path: expansion-threshold.txt
