name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./hnsw ./structs

  benchmarks:
    name: Performance And Quality
    runs-on: ubuntu-latest
    needs: test
    env:
      GOMAXPROCS: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run construction benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^$' \
            -bench 'BenchmarkHNSW(Parallel)?Construction/(Build_(small|medium|large)_.*_ef64|BuildParallel_(small|medium|large)_.*)' \
            -benchmem -benchtime=1x | tee .artifacts/construction.txt

      - name: Run search latency and recall benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test ./benchmarks -run '^$' \
            -bench '^BenchmarkHNSWSearchPerformance$' \
            -benchmem -benchtime=2s -count=3 | tee .artifacts/search.txt

      - name: Run deterministic quality matrix
        shell: bash
        run: |
          set -euo pipefail
          go test ./benchmarks \
            -run 'Test(SearchQualityMatrix|EfConstructionRecallTradeoff|ParallelBuildRecallTradeoff)$' \
            -v | tee .artifacts/quality.txt

      - name: Publish benchmark summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Performance And Quality Summary"
            echo
            echo "### Construction"
            echo '```text'
            sed -n '/^goos:/,$p' .artifacts/construction.txt
            echo '```'
            echo
            echo "### Search"
            echo '```text'
            sed -n '/^goos:/,$p' .artifacts/search.txt
            echo '```'
            echo
            echo "### Quality"
            echo '```text'
            cat .artifacts/quality.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hnsw-performance-${{ github.run_id }}
          path: .artifacts
          if-no-files-found: error
