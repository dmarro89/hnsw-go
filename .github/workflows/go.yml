name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run construction benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^$' \
            -bench 'BenchmarkHNSW(Parallel)?Construction/(Build_(small|medium|large)_.*_ef64|BuildParallel_(small|medium|large)_.*)' \
            -benchmem -benchtime=1x | tee .artifacts/benchmarks.txt

      - name: Publish benchmark summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Benchmark Summary"
            echo
            echo '```text'
            sed -n '/^goos:/,$p' .artifacts/benchmarks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: hnsw-benchmarks-${{ github.run_id }}
          path: .artifacts/benchmarks.txt
          if-no-files-found: error
