name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Build And Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -v '/benchmarks$')
          go test $packages

      - name: Race detector
        run: go test -race ./hnsw ./structs

  benchmarks:
    name: Performance And Quality
    runs-on: ubuntu-latest
    needs: test
    env:
      GOMAXPROCS: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run construction benchmarks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^$' \
            -bench 'BenchmarkHNSW(Parallel)?Construction/(Build_(small|medium|large)_.*_ef64|BuildParallel_(small|medium|large)_.*)' \
            -benchmem -benchtime=1x | tee .artifacts/construction.txt

      - name: Compare serial and parallel construction
        shell: bash
        env:
          HNSW_CONSTRUCTION_COMPARISON: "1"
          HNSW_CONSTRUCTION_COMPARISON_OUTPUT: ${{ github.workspace }}/.artifacts/construction-comparison.md
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^TestConstructionComparison$' -count=1 -v \
            | tee .artifacts/construction-comparison.txt

      - name: Run search latency and recall benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test ./benchmarks -run '^$' \
            -bench '^BenchmarkHNSWSearchPerformance$' \
            -benchmem -benchtime=2s -count=3 | tee .artifacts/search.txt

      - name: Run quality gates and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          go test ./benchmarks \
            -run 'Test(SearchQualityMatrix|EfConstructionRecallTradeoff|ParallelBuildRecallTradeoff)$' \
            -v | tee .artifacts/quality.txt

      - name: Publish benchmark summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Performance And Quality Summary"
            echo
            echo "### Serial vs parallel construction"
            echo
            if [[ -f .artifacts/construction-comparison.md ]]; then
              cat .artifacts/construction-comparison.md
            else
              echo "Construction comparison did not complete."
            fi
            echo
            echo "> Peak heap delta is sampled every 5 ms and excludes the pre-generated input vectors. Total allocated is cumulative allocation traffic during the build."
            echo
            echo "### Construction benchmark details"
            echo '```text'
            if [[ -f .artifacts/construction.txt ]]; then sed -n '/^goos:/,$p' .artifacts/construction.txt; fi
            echo '```'
            echo
            echo "### Search"
            echo '```text'
            if [[ -f .artifacts/search.txt ]]; then sed -n '/^goos:/,$p' .artifacts/search.txt; fi
            echo '```'
            echo
            echo "### Quality diagnostics"
            echo '```text'
            if [[ -f .artifacts/quality.txt ]]; then cat .artifacts/quality.txt; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnsw-performance-${{ github.run_id }}
          path: ${{ github.workspace }}/.artifacts
          include-hidden-files: true
          if-no-files-found: error
