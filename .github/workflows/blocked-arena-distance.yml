name: Blocked arena distance experiment

on:
  pull_request:
    paths:
      - 'benchmarks/distance_blocked_arena_test.go'
      - '.github/workflows/blocked-arena-distance.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Correctness
        run: go test ./benchmarks -run TestDistanceBlock4Agrees -count=1
      - name: Benchmark blocked arena
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^$' -bench '^BenchmarkDistanceBlock4$' -benchmem -count=7 | tee .artifacts/distance-block4.txt
      - uses: actions/upload-artifact@v4
        with:
          name: distance-block4-${{ github.run_id }}
          path: .artifacts/distance-block4.txt
