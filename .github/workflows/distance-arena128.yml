name: Fixed-128 arena distance experiment

on:
  pull_request:
    paths:
      - 'benchmarks/distance_arena128_test.go'
      - '.github/workflows/distance-arena128.yml'
      - 'hnsw/utils.go'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    env:
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Correctness
        run: go test ./benchmarks -run TestDistanceArena128OffsetAgrees -count=1
      - name: Benchmark fixed-128 arena offset
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts
          go test ./benchmarks -run '^$' -bench '^BenchmarkDistanceArena128Offset$' -benchmem -count=7 | tee .artifacts/distance-arena128.txt
      - uses: actions/upload-artifact@v4
        with:
          name: distance-arena128-${{ github.run_id }}
          path: .artifacts/distance-arena128.txt
