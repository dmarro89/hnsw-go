name: Cross-language HNSW benchmark

on:
  pull_request:
    branches: ["main"]
    paths:
      - "benchmarks/crosslang/**"
      - ".github/workflows/cross-language.yml"
      - "hnsw/**"
  workflow_dispatch:

jobs:
  compare:
    name: Go vs hnswlib vs USearch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: 4
      OMP_NUM_THREADS: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install comparison engines
        run: python -m pip install --disable-pip-version-check numpy hnswlib usearch

      - name: Build Go benchmark runner
        run: go build ./benchmarks/crosslang/go

      - name: Run comparison matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python benchmarks/crosslang/compare.py | tee .artifacts/cross-language.md

      - name: Publish comparison
        if: always()
        shell: bash
        run: |
          {
            echo "## Cross-language HNSW construction benchmark"
            echo
            if [[ -f .artifacts/cross-language.md ]]; then cat .artifacts/cross-language.md; fi
            echo
            echo "> Same deterministic float32 dataset, 128 dimensions, M=16, efConstruction=64/200, 10k/100k vectors, 1/4 threads. External-engine memory is peak process RSS; hnsw-go memory is live Go heap delta, so memory columns are diagnostic rather than directly equivalent."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-${{ github.run_id }}
          path: .artifacts
          include-hidden-files: true
          if-no-files-found: error
